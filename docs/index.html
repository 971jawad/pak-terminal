<meta charset="utf-8">
<title>Pak Terminal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --ground:#f4f6f8; --panel:#ffffff; --panel2:#eef1f5; --border:#d7dee6;
  --ink:#0f1720; --muted:#5b6876; --faint:#8894a3;
  --accent:#c8791a; --accent-soft:#f0d6b0;
  --up:#1a7f37; --down:#c9302c; --cyan:#0e7c8c; --violet:#6b46c1;
  --grid:#e2e8ef; --shadow:0 1px 3px rgba(16,24,32,.08),0 8px 24px rgba(16,24,32,.06);
  --mono:"Cascadia Code","SF Mono","JetBrains Mono",Consolas,ui-monospace,monospace;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0a0e14; --panel:#111823; --panel2:#0d141d; --border:#1f2a37;
  --ink:#e6edf3; --muted:#8b97a6; --faint:#5d6a79;
  --accent:#f5a623; --accent-soft:#3a2c14;
  --up:#3fb950; --down:#f85149; --cyan:#4cc4d6; --violet:#a371f7;
  --grid:#182230; --shadow:0 1px 0 rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --ground:#0a0e14; --panel:#111823; --panel2:#0d141d; --border:#1f2a37;
  --ink:#e6edf3; --muted:#8b97a6; --faint:#5d6a79;
  --accent:#f5a623; --accent-soft:#3a2c14;
  --up:#3fb950; --down:#f85149; --cyan:#4cc4d6; --violet:#a371f7;
  --grid:#182230; --shadow:0 1px 0 rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint)}
.up{color:var(--up)} .down{color:var(--down)} .accent{color:var(--accent)}
.muted{color:var(--muted)}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--panel);
  border-bottom:1px solid var(--border)}
.hbar{display:flex;align-items:center;gap:14px;padding:10px 18px}
.brand{font-family:var(--mono);font-weight:700;letter-spacing:.08em;font-size:15px}
.brand b{color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--up);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--up) 22%,transparent)}
.chip{font-family:var(--mono);font-size:11px;padding:3px 8px;border:1px solid var(--border);
  border-radius:999px;color:var(--muted);white-space:nowrap}
.spacer{flex:1}
.themebtn{cursor:pointer;background:var(--panel2);border:1px solid var(--border);
  color:var(--muted);border-radius:8px;padding:5px 9px;font-family:var(--mono);font-size:12px}
/* ticker strip */
.ticker{display:flex;gap:0;overflow:hidden;border-top:1px solid var(--border);
  background:var(--panel2)}
.ticker .track{display:flex;gap:26px;padding:6px 18px;white-space:nowrap;
  animation:scroll 42s linear infinite}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker .track{animation:none}}
.tk{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tk b{color:var(--ink);font-weight:600}
/* tabs */
nav.tabs{display:flex;gap:2px;padding:0 12px;overflow-x:auto;background:var(--panel);
  border-bottom:1px solid var(--border)}
nav.tabs button{background:none;border:none;border-bottom:2px solid transparent;
  color:var(--muted);font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;
  text-transform:uppercase;padding:11px 13px;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

main{max-width:1240px;margin:0 auto;padding:20px 18px 80px}
.panel{display:none;animation:fade .25s ease}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:16px 18px;box-shadow:var(--shadow)}
.card h3{font-size:13px;font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sect-title{font-size:22px;font-weight:650;margin-bottom:4px}
.lead{color:var(--muted);max-width:70ch;margin-bottom:18px}
.tag{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:5px;
  border:1px solid var(--border);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tag.ok{color:var(--up);border-color:color-mix(in srgb,var(--up) 40%,var(--border))}
.tag.info{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 40%,var(--border))}
.tag.warn{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--border))}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:right;padding:6px 9px;border-bottom:1px solid var(--grid);white-space:nowrap}
th{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--faint);font-weight:600;position:sticky;top:0;background:var(--panel);cursor:pointer}
th:first-child,td:first-child{text-align:left}
tbody tr:hover{background:var(--panel2)}
.tablewrap{overflow-x:auto;max-height:460px;overflow-y:auto}
.bar{height:8px;border-radius:4px;background:var(--panel2);position:relative;overflow:hidden;min-width:60px}
.bar>span{position:absolute;top:0;bottom:0;border-radius:4px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.1}
.kpi .l{font-size:11px;color:var(--faint);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
.badge{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-weight:700;
  font-size:20px;letter-spacing:.06em;padding:10px 16px;border-radius:10px}
.badge.on{color:var(--up);background:color-mix(in srgb,var(--up) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--up) 35%,transparent)}
.badge.off{color:var(--down);background:color-mix(in srgb,var(--down) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--down) 35%,transparent)}
.gauge{display:flex;gap:5px}
.gauge i{width:26px;height:10px;border-radius:3px;background:var(--panel2)}
.gauge i.f{background:var(--up)}
.chipwrap{display:flex;flex-wrap:wrap;gap:7px}
.mchip{font-family:var(--mono);font-size:11.5px;padding:4px 9px;border-radius:7px;
  border:1px solid var(--border);background:var(--panel2)}
svg{display:block;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.note{font-size:12px;color:var(--faint);border-left:2px solid var(--accent);padding:2px 0 2px 11px;margin-top:12px}
.chain{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--panel2)}
.chain .trig{font-weight:600;margin-bottom:5px}
.chain .mech{font-size:12.5px;color:var(--muted);margin-bottom:9px}
.pill{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:999px;margin:2px 4px 2px 0;display:inline-block}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:12.5px}
.newsitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;
  padding:9px 0;border-bottom:1px solid var(--grid)}
.tier{font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;white-space:nowrap}
.cols2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.cols3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.toggle{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.toggle button{background:var(--panel);border:none;color:var(--muted);font-family:var(--mono);
  font-size:11.5px;padding:5px 11px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--accent);color:#111}
.hint{cursor:help;border-bottom:1px dotted var(--faint)}
</style>

</header>

inance-minister-tells-na"}]}, "sources": {"sources": [{"name": "PSX Data Portal (dps.psx.com.pk)", "url": "https://dps.psx.com.pk/", "data_types": ["prices", "indices", "OHLCV history", "sector data", "company fundamentals/announcements", "fixed income", "dividends/payouts"], "access": "scrape (undocumented JSON/HTML endpoints) + manual; official bulk data licensing via marketdatarequest@psx.com.pk", "free": true, "notes": "The single best free primary source. Public, no login, data delayed ~5 min (powered by Capital Stake). Undocumented but stable JSON-ish endpoints widely scraped: /timeseries/int/{SYMBOL} (intraday), /timeseries/eod/{SYMBOL} (EOD history), /market-watch, /company/{SYMBOL}, /historical, /symbols, /sector-summary, /screener, /indices, /downloads. Several open-source wrappers exist (mtauha/psxdata, MuhammadAmir5670/psx-data-reader, ahad-raza24/PSX-MCP-Server). Light/no bot-wall on JSON endpoints; be polite with rate. Financials live on a separate financials portal. Update: real-time-ish during session; EOD after close."}, {"name": "PSX main site (psx.com.pk)", "url": "https://www.psx.com.pk/", "data_types": ["indices (KSE100/KSE30/KMI30/ALLSHR etc.)", "product & services info", "listed-company directory", "regulatory notices", "IPO info"], "access": "manual / scrape", "free": true, "notes": "Corporate/regulatory site rather than a data API. Good for index methodology, constituents, listing rules, notices. Time-series market data is better pulled from dps.psx.com.pk. No public API."}, {"name": "SCSTrade / stocks.pk (scstrade.com)", "url": "https://www.scstrade.com/", "data_types": ["fundamentals & ratios (EPS, PE, Book Value, ROE, ROA)", "company snapshots", "quarterly financials", "yearly ratios", "technicals", "real-time charting", "research reports", "sector"], "access": "scrape (ASP.NET .aspx pages + internal AJAX/JSON handlers); manual", "free": true, "notes": "Broker (SCS) research portal; one of the richest FREE fundamentals/ratios sources for PSX. Key pages: /stockscreening/SS_CompanySnapShot.aspx?symbol=XXX, SS_CompanySnapShotQF.aspx (quarterly financials), SS_CompanySnapShotYR.aspx (yearly ratios), SS_TechSnapShot.aspx (technicals), /research/RE_Reports.aspx. Legacy ASP.NET means __VIEWSTATE/__EVENTVALIDATION tokens on POSTs; some data loads via internal JSON web-methods you can hit directly. stocks.pk historically redirected/related to the same SCS ecosystem. No official API; scrape-friendly-ish but structure changes occasionally. Update: intraday for quotes, per-filing for fundamentals."}, {"name": "Sarmaaya (sarmaaya.pk)", "url": "https://sarmaaya.pk/", "data_types": ["prices", "indices (KSE100 with PE, div yield, mcap, 52wk)", "fundamentals/ratios", "dividends/payouts", "earnings", "mutual funds", "sector analysis", "20+ yrs history"], "access": "scrape / manual; freemium with login for portfolio & premium", "free": true, "notes": "PSX-authorized data redistributor. Clean, structured pages (e.g. /indexes/KSE100, per-company pages) make it a good scrape target for fundamentals, payouts and fund data. Freemium: basic market data free; portfolio tracking, calculators and some research behind login/subscription. No documented public API. Reliable and well-maintained; update frequency intraday to daily."}, {"name": "KSEStocks (ksestocks.com)", "url": "https://www.ksestocks.com/", "data_types": ["prices/quotations", "daily market summary", "earnings", "board meetings", "book closures", "dividend schedule", "historic high/low", "technicals (ADX, Parabolic SAR, pivots)"], "access": "scrape / manual", "free": true, "notes": "Long-running community/analytics site focused on corporate-action calendars (board meetings, book closures, dividend schedule) and daily quotations \u2014 useful complement to price sources. Content-heavy HTML; scrape by page. No API. Medium reliability; update daily/around events."}, {"name": "Mettis Global (mettisglobal.news)", "url": "https://mettisglobal.news/", "data_types": ["real-time market news", "equity/results news", "macro (forex, inflation, rates) commentary", "market data pages", "PSX roundup"], "access": "scrape / manual; commercial Mettis terminal/data feed is paid", "free": true, "notes": "Primarily a financial NEWS + data-analytics house (Karachi). Free news site (mettisglobal.news) with /MarketData, /equity, /PSXRoundup sections; the real product is a paid professional terminal/data feed (MG Link) sold to institutions \u2014 pricing on request. Good for real-time news, results announcements and forex/rates commentary. No free public API."}, {"name": "Business Recorder markets (brecorder.com/markets)", "url": "https://www.brecorder.com/markets", "data_types": ["KSE100/stocks tables", "forex/interbank & open-market rates", "gold/bullion rates", "commodities", "business & market news", "sector"], "access": "scrape / manual", "free": true, "notes": "Leading financial daily; markets section carries quote tables, gold and currency rates plus news. WebFetch hit HTTP 403 (bot-wall / WAF) \u2014 needs a realistic User-Agent/headers or headless browser to scrape reliably. No API; primarily news + snapshot tables, not deep time-series."}, {"name": "Profit by Pakistan Today (profit.pakistantoday.com.pk)", "url": "https://profit.pakistantoday.com.pk/psx/", "data_types": ["PSX market news/wraps (KSE100 levels, points moves)", "macro & business news", "sector/company news"], "access": "scrape / manual", "free": true, "notes": "Business magazine \u2014 NEWS not structured data. Good for daily PSX session wraps (open/high/close, points) and macro/policy context to enrich a dataset with event/sentiment tags. No numeric API; parse article text. Reliable editorially; daily updates."}, {"name": "Investing.com \u2014 Pakistan / Karachi 100", "url": "https://www.investing.com/indices/karachi-100-historical-data", "data_types": ["KSE100 index quote & historical OHLCV/volume", "some PSX equities", "currency (USD/PKR)", "commodities", "macro calendar"], "access": "scrape (heavy anti-bot) / manual download", "free": true, "notes": "Has downloadable KSE100 historical data and equity quotes, but aggressive Cloudflare/anti-bot (JS challenges, 403s) makes scraping fragile \u2014 needs headless browser/undetected driver or their paid partners. No free official API (investing.com API is unofficial/deprecated). Coverage of individual PSX small-caps is patchy. Medium reliability for the index."}, {"name": "Trading Economics \u2014 Pakistan (tradingeconomics.com/pakistan)", "url": "https://tradingeconomics.com/pakistan/indicators", "data_types": ["macro (GDP, inflation 9.2%, policy rate 11.5%, USD/PKR ~278, debt/GDP 83%, unemployment, current account, FX reserves)", "KSE100 index quote/history", "credit rating page"], "access": "official API (paid) + scrape/manual for web pages", "free": false, "notes": "Broad macro + markets aggregator with a documented API (docs.tradingeconomics.com) but the free API tier is very limited (sample/select series only); full Pakistan coverage and KSE100 history need a paid subscription. Web pages scrapeable for spot values. Also hosts a clean /pakistan/rating page consolidating S&P/Moody's/Fitch. High reliability; update daily/on release."}, {"name": "CEIC Data \u2014 Pakistan", "url": "https://www.ceicdata.com/en/country/pakistan", "data_types": ["deep macro (national accounts, BoP, monetary, fiscal, trade, inflation, FX)", "industry/sector data", "socio-demographic", "forecasts"], "access": "paid subscription (platform + API/Excel plugin); 10-day free flex trial", "free": false, "notes": "Premium macro/industry database (6.6M+ series, 200+ economies) with strong Pakistan depth sourced from SBP/PBS/ministries \u2014 cleaned and standardized. Not free: subscription required; 10-day no-card trial gives temporary access. Best when budget exists and you want normalized, ready-to-use macro series instead of scraping SBP/PBS yourself. High reliability."}, {"name": "WSJ / MarketWatch / Bloomberg \u2014 Pakistan (KSE100)", "url": "https://www.bloomberg.com/quote/KSE100:IND", "data_types": ["KSE100 index quote/chart", "limited PSX equity quotes", "macro headlines"], "access": "scrape (heavy paywall/anti-bot) / manual", "free": false, "notes": "Western terminals carry the KSE100 index (Bloomberg KSE100:IND; MarketWatch/WSJ quote pages) but individual PSX stock coverage is thin and most useful data sits behind paywalls + strong anti-bot. Not a practical bulk source for Pakistan; use only for cross-checking the headline index. Low practical value vs local sources."}, {"name": "State Bank of Pakistan \u2014 EasyData (easydata.sbp.org.pk)", "url": "https://easydata.sbp.org.pk/", "data_types": ["macro & monetary (policy/interest rates, monetary aggregates M2, FX reserves, exchange rate, external sector/BoP, debt, real sector)", "18,000+ time series incl. mirrored PBS data"], "access": "API (new dataset-retrieval API) + web plot/CSV/Excel download; scrape", "free": true, "notes": "THE authoritative free macro source. Interactive Oracle APEX portal, no login, 18,000+ variables across ~90 datasets; recent upgrade added an API to retrieve full datasets plus related-series/most-viewed features. NOTE: base URL returned HTTP 403 to plain WebFetch (APEX session + WAF) \u2014 hit the specific f?p= APEX deep-links or the dataset API with proper session/headers, or a headless browser. Highest reliability for monetary/external data; update per SBP release schedule."}, {"name": "State Bank of Pakistan \u2014 main site (sbp.org.pk)", "url": "https://www.sbp.org.pk/", "data_types": ["monetary policy statements", "monthly Statistical Bulletin (PDF)", "reserves & rates", "circulars/regulations", "economic reports"], "access": "manual / scrape (mostly PDF)", "free": true, "notes": "Primary-source PDFs (e.g. Monthly Statistical Bulletin) and policy announcements. Use EasyData for machine-readable series; use the main site for narrative reports and the latest headline numbers. Free, high reliability, monthly/on-release updates. PDF parsing required for tables."}, {"name": "Pakistan Bureau of Statistics (pbs.gov.pk)", "url": "https://www.pbs.gov.pk/", "data_types": ["CPI inflation & weekly SPI", "national accounts/GDP", "external trade", "population & agriculture census 2023", "labour/HIES", "prices"], "access": "manual / scrape; interactive dashboards; PDF & flipbook downloads", "free": true, "notes": "Authoritative source for inflation (CPI/SPI), GDP and trade. Data mostly as PDF reports + interactive web dashboards (National Accounts, Census 2023, Trade Statistics); NO documented API (though much of it is mirrored into SBP EasyData in machine-readable form \u2014 prefer EasyData for series). Free, high reliability, monthly (CPI/SPI) to annual cadence."}, {"name": "Finance Division \u2014 Pakistan Economic Survey (finance.gov.pk)", "url": "https://www.finance.gov.pk/survey_2026.html", "data_types": ["annual Pakistan Economic Survey (all macro sectors)", "budget documents", "fiscal operations", "debt", "MEFP/IMF-linked docs"], "access": "manual download (HTML + PDF chapters)", "free": true, "notes": "Flagship annual Economic Survey (2025-26 published Jul 2026) with per-chapter PDFs + Highlights; also budget-in-brief and fiscal data. Great for annual authoritative fiscal/real-sector numbers and policy context. No API; scrape/parse HTML index + PDFs. Free, high reliability, mainly annual (survey/budget cycle)."}, {"name": "IMF \u2014 Pakistan country page & data portal", "url": "https://www.imf.org/en/countries/pak", "data_types": ["Article IV & EFF program staff reports (rich macro tables/projections)", "WEO indicators", "program/financing data", "forecasts"], "access": "free API (IMF Data Portal / SDMX) + manual PDF download", "free": true, "notes": "Country page hosts Article IV / EFF reports (e.g. CR 24/310 & 24/311, 37-month EFF SDR 5.32bn) \u2014 excellent for validated macro + forward projections. IMF Data Portal (data.imf.org, new; legacy at legacydata.imf.org) offers free programmatic access (SDMX/JSON) to WEO, IFS, BOP etc. incl. Pakistan. High reliability; WEO twice-yearly, reports per review. Best free source for forecasts/projections."}, {"name": "Sovereign ratings \u2014 S&P / Moody's / Fitch (Pakistan) + aggregators", "url": "https://tradingeconomics.com/pakistan/rating", "data_types": ["sovereign-ratings (long/short-term foreign-currency ratings + outlook)", "rating-action rationale"], "access": "manual (agency press releases; free registration for full agency reports) + scrape aggregators", "free": true, "notes": "Current (2026): S&P B-/Stable (upgraded from CCC+, Jul 2025); Fitch B-/Stable (upgraded Apr 2025 from CCC+); Moody's Caa1/Positive (upgraded from Caa2). Agency sites (spglobal.com, moodys.com, fitchratings.com) need free login for full reports; ratings themselves are public via press releases. Easiest structured pull: aggregators tradingeconomics.com/pakistan/rating, countryeconomy.com/ratings/pakistan, theglobaleconomy.com/Pakistan/credit_rating. No API on free tier; update only on rating actions."}, {"name": "EODHD (PSX.KAR) \u2014 third-party API aggregator", "url": "https://eodhd.com/financial-summary/PSX.KAR", "data_types": ["PSX EOD & historical prices", "fundamentals (EPS, PE, PEG, EBITDA, dividends, splits)", "some ratios", "ticker as .KAR"], "access": "paid API (free tier limited to ~20 calls/day, delayed/EOD)", "free": false, "notes": "Commercial financial-data API that lists Pakistan (Karachi, suffix .KAR). JSON/CSV, developer-friendly \u2014 the main turnkey API if you want to avoid scraping. Coverage of PSX fundamentals is decent but not exhaustive vs local sources and can lag; paid subscription needed for full/real usage. Alternatives with thin PSX coverage: GuruFocus, Simply Wall St (analysis, not bulk API). Medium reliability for PK specifically."}, {"name": "Open-source PSX scrapers / libraries", "url": "https://github.com/mtauha/psxdata", "data_types": ["OHLCV histor PANELS.Interconnections=()=>{
  const wrap=$('div',{});

    $('p',{class:'lead'},'A curated supply-chain / macro-sensitivity map — inputs, outputs, and how each sector reacts to rates, the rupee, oil, and global shocks. This is an expert PRIOR (economic logic + cited facts), not a fitted model. Hover a node for detail.'));
  const g=D.graph;
  if(!g.sectors.length){wrap.append($('div',{class:'card muted'},'sector graph not seeded'));return wrap;}
  // network
  const ns='http://www.w3.org/2000/svg',W=900,H=560,cx=W/2,cy=H/2,R=Math.min(W,H)/2-70;
  const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('width','100%');
  const nodes=g.sectors.map((s,i)=>{const a=-Math.PI/2+i/g.sectors.length*2*Math.PI;
    return{...s,x:cx+R*Math.cos(a),y:cy+R*Math.sin(a),a};});
  const byname=Object.fromEntries(nodes.map(n=>[n.name,n]));
  const perf=Object.fromEntries(D.sectors.perf.map(p=>[p.sector,p.r_12m]));

        <span class="mono" style="font-size:11px">12M ${pct(r12)}</span><br>
        <div class="mono" style="font-size:11px;margin-top:5px">rate ${sgn(ms.policy_rate)} · pkr↓ ${sgn(ms.pkr_depreciation)} · oil ${sgn(ms.oil)} · remit ${sgn(ms.remittances)}</div>
        <div style="font-size:11px;margin-top:5px;color:var(--muted)">in: ${(n.inputs||[]).slice(0,3).join(', ')||'—'}</div>`;});
    c.addEventListener('mouseleave',()=>tip.style.opacity=0);

    const tx=document.createElementNS(ns,'text');const out=n.x>cx;

  const netcard=$('div',{class:'card'});

      $('span',{},$('i',{style:'background:'+heat(0.3)}),'12M up'),
      $('span',{},$('i',{style:'background:'+heat(-0.3)}),'12M down'),
      $('span',{},'edges = downstream (sells-to) links')));
  wrap.append(netcard,tip);

tb.addEventListener('click',()=>{const cur=document.documentElement.getAttribute('data-theme');
  const mq=matchMedia('(prefers-color-scheme:dark)').matches;
  const next=cur? (cur==='dark'?'light':'dark') : (mq?'light':'dark');
  document.documentElement.setAttribute('data-theme',next);});
// initial
show(location.hash?decodeURIComponent(location.hash.slice(1)):'Regime');
</script>
