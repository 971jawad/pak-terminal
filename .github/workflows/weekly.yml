name: weekly-macro-refresh

on:
  schedule:
    - cron: "0 6 * * 0"   # Sundays 06:00 UTC
  workflow_dispatch:        # allow manual runs

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet requests
      - name: Refresh macro (World Bank + news headlines)
        run: python scripts/refresh_macro.py
      - name: Commit refreshed macro data
        run: |
          git config user.name "macro-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/macro/worldbank.json data/macro/headlines.json
          git commit -m "Weekly macro refresh $(date -u +%Y-%m-%d)" || echo "no changes"
          git push
      # The daily deploy workflow rebuilds the bundle + docs and picks these up.
